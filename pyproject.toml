[project]
name = "hhhs-db-manager"
version = "0.1.0"
description = "한일합섬 ERP(NEOE, MS SQL Server) 읽기 전용 조회 도구 — 팀원·에이전트 공용"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "SQLAlchemy>=2.0",
    "pymssql>=2.3",
    "python-dotenv>=1.0",
]

[project.scripts]
hhhs-db = "hhhs_db_manager:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["hhhs_db_manager"]
